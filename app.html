  for(const n of (horizons||[5,10,20])){
    const real=[],plac=[];
    for(const e of events){
      const r=fwd(e.tk,e.d,n); if(r!=null)real.push(r);
      const pool=DAYS.filter(d=>!evd[e.tk].has(d));
      if(!pool.length)continue;
      const q=fwd(e.tk,pool[placeboIdx(e.tk,e.d,n,pool.length)],n);
      if(q!=null)plac.push(q);
    }
    if(!real.length||!plac.length)continue;
    const row={sessions:n,spike:desc(real),placebo:desc(plac)};
    row.gap_median=+(row.spike.median-row.placebo.median).toFixed(2);
    rows.push(row);
  }
  return {events:events.length,archive_days:DAYS.length,
    span:DAYS.length?[DAYS[0],DAYS[DAYS.length-1]]:[],
    headline_sessions:20,horizons:rows};
}

/* The whole feature rests on the claim that this reproduces the pipeline, so it says
   out loud whether it does rather than asking to be trusted. Runs once, after the last
   snapshot streams in — before that the scan is working from a partial archive and
   would disagree for a reason that is not a bug. */
function selfCheck(){
  if(SCANOK!==null||!EVENTS0||!FINDING0)return;
  const mine=scanEvents(SPK0);
  const key=a=>a.map(e=>e.tk+'|'+e.d).sort().join(',');
  const evOK=key(mine)===key(EVENTS0);
  const f=scanFinding(mine,(FINDING0.horizons||[]).map(h=>h.sessions));
  const g=s=>((f.horizons.find(h=>h.sessions===s)||{}).gap_median);
  const fiOK=(FINDING0.horizons||[]).every(h=>g(h.sessions)===h.gap_median);
  SCANOK={ev:evOK,fi:fiOK,n:mine.length,want:EVENTS0.length};
  if(!evOK||!fiOK)console.warn('spike scan does not reproduce the shipped files',SCANOK);
}

/* Sensitivity, computed once and cached: the same grid the thresholds live in, so the
   answer to "did you pick 30 and 3 because they gave the best number" is on screen
   instead of being a fair thing to wonder. */
function spkGrid(peek){
  /* Keyed on the two axes the grid does NOT vary. It sweeps floor and multiple while
     holding lookback and gap at whatever is set, so a cache that ignored those went
     stale the moment either slider moved — showing gaps from a definition nobody had
     selected, under labels that implied they were current. */
  const key=SPK.look+'/'+SPK.gap;
  if(GRID&&GRID.key===key)return GRID.rows;
  /* A sweep is 15 scans — about 180ms over 1,860 tickers, against 17ms for one scan.
     The floor and mult sliders leave this key alone and stay cheap; lookback and gap
     invalidate it every step, so dragging one from 20 to 40 was 3.5 seconds of frozen
     main thread. Mid-drag the caller peeks: it gets nothing rather than paying, and
     shows the previous sweep greyed until the gesture ends. */
  if(peek)return null;
  const rows=[];
  for(const floor of [10,20,30,50,100])for(const mult of [2,3,5]){
    const ev=scanEvents({...SPK,floor,mult});
    const h=scanFinding(ev,[20]).horizons[0];
    rows.push({floor,mult,n:h?h.spike.n:0,gap:h?h.gap_median:null,
      /* Not cosmetic: a cell looser than the default scores a biased subset, so the
         grid has to be able to say which of its own numbers to trust less. */
      unpriced:ev.filter(e=>!PRICES[e.tk]).length,total:ev.length});
  }
  GRID={key,rows};
  return rows;
}
/* Recompute everything downstream of the definition. EVENTS and FINDING are what the
   rest of the page reads, so swapping them is the whole mechanism — the lists, the
   chart carets, the board badges and the headline all follow without knowing. */
function applySpike(){
  /* Only ever true once a custom definition has actually been scanned, so nothing on
     screen can claim to be showing one before it is. */
  SPKLIVE=spkCustom()&&SCANOK!==null;
  if(SPKLIVE){EVENTS=scanEvents();FINDING=scanFinding(EVENTS,[5,10,20]);}
  else{EVENTS=EVENTS0;FINDING=FINDING0;}
  TRACK=null;
}

/* How far back the ticker chart reaches. Calendar spans rather than a point count:
   the count was fixed at 40, which is six weeks of daily archive but *four years* of
   crawls, and the axis said neither. */
const TWINS={'1M':30,'3M':90,'6M':182,'1Y':365,'5Y':1826,'MAX':null};
const backFrom=(d,n)=>{const x=new Date(d+'T00:00:00Z');x.setUTCDate(x.getUTCDate()-n);
  return x.toISOString().slice(0,10);};

/* The axis is the union of two clocks that do not line up, which is why it is built
   here once rather than improvised at each call site: price moves on trading sessions,
   attention is read every calendar day including weekends, and the crawls land on
   whatever days archive.org happened to visit. Union — not intersection — because
   dropping the weekend reads would throw away attention, and dropping sessions with no
   read would break the price line. The time axis is what makes the union legible. */
function tkSeries(tk,endDay,win){
  const R=TWINS[win===undefined?TWIN:win];
  const start=R==null?'0000':backFrom(endDay,R);
  const inR=d=>d>=start&&d<=endDay;
  /* Both price files, merged, rather than asking pxOf to pick one. pxOf answers "which
     series covers this day", and for an unbounded range there is no such day: a probe
     older than both makes neither cover, pxOf falls through to prices.json, and MAX
     drew four months where 5Y drew five years. The two also disagree at the other end
     — prices.json runs one session ahead of prices_hist.json — so whichever single file
     is chosen loses one end or the other. Long file first, fresh file second, so the
     newer close wins wherever they overlap. */
  const hist=PXH&&PXH[tk], cur=PRICES[tk];
  const pmap={};
  const add=v=>{if(v&&v.d)v.d.forEach((d,i)=>{if(inR(d)&&v.c[i]!=null)pmap[d]=v.c[i];});};
  add(hist); add(cur);
  const sess=Object.keys(pmap).sort();
  const st=[hist,cur].filter(v=>v&&v.d&&v.d.length).map(v=>v.d[0]).sort();
  const pxStart=st.length?st[0]:null;
  /* Only days this ticker actually appears on. A day it was absent from is not a zero
     — it is below whatever the board's cutoff was — so it earns no slot. */
  /* Deduped: 2026-05-12 and 2026-07-18 exist in both lists, and counting them twice
     would overstate coverage in the note by exactly the amount nobody would notice. */
  const reads=[...new Set([...DAYS,...WBDAYS])].filter(d=>inR(d)&&mAt(d,tk)!=null).sort();
  const days=[...new Set([...sess,...reads])].sort();
  return {days,
    mentions:days.map(d=>mAt(d,tk)),
    prices:days.map(d=>pmap[d]??null),
    reads:reads.length, sess:sess.length,
    /* Crawl days carry rank and mentions but only the top 100, and they are not
       spike-detected — worth saying when a range reaches back into them. */
    crawls:reads.filter(d=>!DAYS.includes(d)).length,
    pxStart, covered:!!(pxStart&&pxStart<=start)};
}
/* Everything a range needs that is not already in memory. The five-year price file is
   3.4 MB and the crawl snapshots are 230 separate fetches, so neither is paid for by a
   visitor who never leaves the default. */
/* The chart can be honestly empty in three different ways — the archive starts after
   the range, the price file does not reach back that far, or the name simply never
   went loud — and a bare span line answered none of them. SPY is the case that made
   this necessary: five years of price, 101 days of attention, zero spikes. */
function rangeNote(tk,S,inView){
  if(!S.days.length)return `Nothing in this range for ${tk}.`;
  const span=`${S.days[0]} → ${S.days[S.days.length-1]}`;
  const bits=[`<b>${span}</b>`,
    `${S.sess} session${S.sess===1?'':'s'} priced`,
    `${S.reads} day${S.reads===1?'':'s'} with a board reading${S.crawls?` (${S.crawls} from archive.org crawls — top 100 only, no spike detection)`:''}`];
  bits.push(inView.length
    ? `<b class="dn">${inView.length} confirmed spike${inView.length===1?'':'s'}</b> marked ▲`
    /* The live definition, not the shipped one. It named 30 and 3× while the sliders
       said something else, so a chart with no carets explained itself by a rule it was
       not being judged against. */
    : `no confirmed spike here — needs ≥${SPK.floor} mentions and ≥${SPK.mult}× the prior ${SPK.look}-day median`);
  /* days[0] is the first day of the *union* — often a board reading with no session
     behind it — so quoting it as the date price history begins was asserting something
     the price file never said, and asserting it even for tickers with no price at all. */
  if(!S.covered)
    bits.push(S.pxStart?`price history starts ${S.pxStart}, so the price line is shorter than the range`
                       :`no price history for ${tk}`);
  return bits.join(' · ')+'.';
}
async function ensureRange(tk,endDay){
  const R=TWINS[TWIN];
  const start=R==null?'0000':backFrom(endDay,R);
  const jobs=[];
  /* Gated on the file being absent, not on how wide the window is. `R>100` asked the
     wrong question — 60 of the 101 archive days have a 3M window reaching behind
     prices.json's 2026-04-01 start — and it also never went false, which is what makes
     the difference here: gated on !PXH this returns false once everything is loaded, so
     it is safe to call from the render path without the repaint re-triggering itself. */
  const cur=PRICES[tk];
  if(!PXH&&(R==null||!cur||!cur.d||!cur.d.length||start<cur.d[0]))jobs.push(ensureHist());
  const need=WBDAYS.filter(d=>d>=start&&d<=endDay&&!(d in SNAP));
  if(need.length)jobs.push(loadDays(need));
  if(!jobs.length)return false;
  await Promise.all(jobs);
  return true;
}

/* A dead end otherwise: "pending" says the window has not closed but not when it
   will, and the answer is knowable — count the sessions still owed and add them at
   five a week. */
function resolveNote(e){
  const[p,i]=priceIdx(e.tk,e.d);
  if(!p||i<0)return 'waiting on the first session';
  const owed=10-Math.max(0,Math.min(10,p.d.length-1-i));
  if(owed<=0)return '10 sessions after';
  const last=new Date((p.d[p.d.length-1]||e.d)+'T00:00:00Z');
  last.setUTCDate(last.getUTCDate()+Math.ceil(owed*7/5));
  return `${owed} session${owed>1?'s':''} to go · about ${last.toISOString().slice(0,10)}`;
}

function eventDetail(){
  const e=eventRows().find(x=>key(x)===SEL); if(!e)return '';
  const sess=WINS[WIN];
  const W=winDays(e.tk,e.d,sess);
  const days=W.days;
  const mm=days.map(d=>mOf(d,e.tk));
  const p=pxOf(e.tk,days[0]);
  const pl=days.map(d=>{const k=p?p.d.indexOf(d):-1;return k>=0?p.c[k]:null;});
  const span=`${days[0]} → ${days[days.length-1]}`;
  /* Say how much of the window exists. "I picked 2W and got four days" was a real
     question about the other page, and the answer was always that the archive simply
     ended there — which nothing on screen said. */
  const spanNote=sess==null?`Full archive · ${span}`
    :!W.priced?`${span} · no sessions yet — prices have not reached this spike`
    :W.have>=sess?`${span} · ${sess} of ${sess} sessions after the spike`
    :`${span} · ${W.have} of ${sess} sessions priced — fills in as sessions close`;
  const st=(k,v,c='')=>`<div class="stat"><div class="k">${k}</div><div class="v ${c}">${v}</div></div>`;
  return `<button class="back" data-back="1">‹ All spikes</button>
  <div class="dHead"><div>
      <div class="dTk">${e.tk}${BASKET.has(e.tk)?' <span class="badge b">basket</span>':''}</div>
      <p class="dSub">Confirmed spike on ${e.d} · read ${capLabel(e.d)}${settled(e.d)?'':' · before the close'}</p>
    </div>
    <div class="dOut"><div class="v ${cls(e.r10)}">${e.r10==null?'<span class="mut">pending</span>':pct(e.r10)}</div>
      <div class="k">${e.r10==null?resolveNote(e):'10 sessions after'}</div></div></div>
  <div class="stats">
    ${st('mentions that day',e.m)}
    ${st('prior 20-day median',e.med.toFixed(1))}
    ${st('multiple',' ×'+(e.m/Math.max(e.med,1)).toFixed(1))}
    ${st('after 5',e.r5==null?'—':pct(e.r5),cls(e.r5))}
    ${st('after 10',e.r10==null?'—':pct(e.r10),cls(e.r10))}
    ${st('after 20',e.r20==null?'—':pct(e.r20),cls(e.r20))}
  </div>
  <div class="liveSlot" data-tk="${e.tk}"></div>
  ${/* The focal spike keeps the solid dashed rule; the ticker's other spikes inside
        the same window get carets. A name that goes loud every three weeks reads very
        differently from one that went loud once, and the window was hiding that. */''}
  <div class="chartbox">${chart(days,mm,pl,e.d,760,230,'$',
      {spikes:EVENTS.filter(v=>v.tk===e.tk&&v.d!==e.d&&days.includes(v.d)).map(v=>v.d)})}
    <div class="cLegend"><span><i style="background:var(--acc)"></i>price</span>
      <span><i style="background:var(--bar)"></i>mentions</span>
      <span><i style="background:var(--dn)"></i>spike day</span>
      <span><i style="border:1px solid var(--bar)"></i>read before the close — not comparable</span>
      <span class="hoverHint">hover the chart for any day's price and mentions</span></div>
    <div class="winbar"><span class="mut" style="font-size:11.5px">after spike</span>
      <div class="chips">${Object.keys(WINS).map(k=>
        `<button data-win="${k}" aria-pressed="${WIN===k}">${k==='all'?'ALL':'+'+k}</button>`).join('')}</div></div>
    <p class="note">${spanNote}</p>
  </div>`;
}
function boardDetail(){
  const r=boardRows().find(x=>x.ticker===SEL); if(!r)return '';
  /* Chart from whichever series this date belongs to. Filtering DAYS on a 2021 date
     returns nothing, so the chart came out empty beside a board full of numbers. */
  /* Three months of daily archive is ~90 points; three months of archive.org crawls
     can be two. So a crawl day opens wide unless the range was chosen by hand. */
  if(!TWINSET&&!DAYS.includes(DAY)&&TWIN==='3M')TWIN='5Y';
  const S=tkSeries(r.ticker,DAY);
  const prior=S.days, mm=S.mentions, pl=S.prices;
  const mine=EVENTS.filter(e=>e.tk===r.ticker);
  const inView=mine.filter(e=>prior.includes(e.d)).map(e=>e.d);
  const st=(k,v,c='')=>`<div class="stat"><div class="k">${k}</div><div class="v ${c}">${v}</div></div>`;
  const d24=r.mentions-r.mentions_24h_ago;
  /* On a crawl day the detail is still a real board, but three things behind it are
     not the same, and a reader comparing it to a 2026 card would not know. */
  const wbn=!DAYS.includes(DAY)?`<div class="wbNote${WBSUSPECT.has(DAY)?' bad':''}">
    <b>${DAY} comes from an archive.org crawl</b>, not from collection.
    ${WBSUSPECT.has(DAY)?'<b>This day is flagged frozen</b> — ApeWisdom served an identical page across several dates, so its counts are one reading wearing more than one date. ':''}
    Top 100 rather than 500, read at ${capLabel(DAY)} rather than after the close, and the
    spike detection does not run on it — coverage is too sparse for "the prior 20 archive
    days" to mean 20 days. Mentions and rank are real; a comparison with a 2026 board is not
    like-for-like.</div>`:'';
  return `<button class="back" data-back="1">‹ The board</button>${wbn}
  <div class="dHead"><div>
    <div class="dTk">${r.ticker}${BASKET.has(r.ticker)?' <span class="badge b">basket</span>':''}</div>
    <p class="dSub">${esc(r.name||r.ticker)} · rank #${r.rank} on ${DAY}</p></div>
    <div class="dOut"><div class="v">${r.mentions}</div><div class="k">mentions</div></div></div>
  <div class="stats">
    ${r.ctx===false?st('source','archive.org'):st('prior 20-day median',r.med.toFixed(1))}
    ${r.ctx===false?st('board depth','top '+rowsOf(DAY).length):st('multiple',' ×'+r.x.toFixed(1),r.hot?'dn':'')}
    ${Number.isFinite(d24)?st('24h change',(d24>=0?'+':'')+d24,d24>0?'up':d24<0?'dn':''):st('read at',capLabel(DAY))}
    ${Number.isFinite(r.rank_24h_ago)?st('rank 24h ago','#'+r.rank_24h_ago):st('rank','#'+r.rank)}
    ${st('upvotes',r.upvotes!=null?r.upvotes:'—')}
    ${st('past spikes',r.ctx===false?'n/a':mine.length)}
  </div>
  <div class="liveSlot" data-tk="${r.ticker}"></div>
  <div class="chartbox">${prior.length?chart(prior,mm,pl,r.hot?DAY:'',760,230,'$',{timeAxis:true,spikes:inView})
      :'<p class="note">No price or attention data in this range.</p>'}
    <div class="cLegend"><span><i style="background:var(--acc)"></i>price</span>
      <span><i style="background:var(--bar)"></i>mentions</span>
      ${inView.length?'<span><i style="background:var(--dn)"></i>confirmed spike</span>':''}
      <span><i style="border:1px solid var(--bar)"></i>read before the close</span>
      <span class="hoverHint">hover for any day's price and mentions</span></div>
    <div class="winbar"><span class="mut" style="font-size:11.5px">range</span>
      <div class="chips">${Object.keys(TWINS).map(k=>
        `<button data-twin="${k}" aria-pressed="${TWIN===k}">${k}</button>`).join('')}</div></div>
    <p class="note">${rangeNote(r.ticker,S,inView)}</p></div>
  ${mine.length?`<h3>Past confirmed spikes</h3><div class="tblwrap"><table>
    <thead><tr><th>date</th><th class="n">mentions</th><th class="n">×</th><th class="n">5d</th><th class="n">10d</th><th class="n">20d</th></tr></thead>
    <tbody>${mine.slice().sort((a,b)=>b.d.localeCompare(a.d)).map(e=>{
      const f=n=>{const v=ret(e.tk,e.d,n);return v==null?'<span class="mut">—</span>':`<span class="${cls(v)}">${pct(v)}</span>`;};
      return `<tr class="jump" data-jump="${e.d}|${e.tk}" title="Open this spike in Aftermath">
        <td>${e.d} ›</td><td class="n">${e.m}</td><td class="n">×${(e.m/Math.max(e.med,1)).toFixed(0)}</td>
        <td class="n">${f(5)}</td><td class="n">${f(10)}</td><td class="n">${f(20)}</td></tr>`;}).join('')}
    </tbody></table></div>`:''}`;
}
/* Asked out loud: "is mentions the end-of-day figure, or does it update hourly?"
   Nothing on either front end answered it, and the answer changes how every number
   here reads — so it lives one click from the numbers rather than in a README. */
function methodHTML(){
  const last=DAYS[DAYS.length-1], t=capAt(last);
  return `<div class="dHead"><div><div class="dTk">How to read these numbers</div>
      <p class="dSub">What is measured, when it is read, and what that costs.</p></div></div>
    <h3>Mentions is a rolling 24-hour count, not a daily total</h3>
    <p class="note">ApeWisdom reports how often a ticker was mentioned on r/wallstreetbets in
      the 24 hours <b>before the moment it is read</b>. A day's archived figure is whatever the
      last successful run of that UTC date saw, so it covers roughly
      <b>[read time − 24h → read time]</b>, not the calendar day. It can fall as well as rise
      during the day: on 2026-08-05 three reads gave MU 403, then 364, then 348, while AMD went
      1090 → 1162 → 1171. A cumulative total could not do that.</p>
    <h3>Which read wins</h3>
    <p class="note">Each run overwrites that date's file, so the value freezes at the last run
      before UTC midnight. Collection aims for after the US close — 14 attempts a day, five of
      them past 21:00 UTC — but scheduling is best-effort, so the page states the read time
      wherever it matters and draws a hollow bar for any day read before the close.
      ${t?`The newest day, ${last}, was read at ${capLabel(last)}${settled(last)?' — after the close.':' — before the close, so it is not yet comparable to the days beside it.'}`:''}</p>
    <h3>What that costs you</h3>
    <p class="note">Two days are comparable only when their reads are about 24 hours apart.
      Checked against the archive's own <code>mentions_24h_ago</code> field, a ~24h gap
      reproduces the previous day's figure to within 0.5–6%; an 11-hour gap misses it by 72%.
      It also means adding daily counts across a range double-counts the overlap — read a range
      total as scale, not as an exact number of conversations.</p>
    <h3>Spike, and what follows it</h3>
    <p class="note">A confirmed spike is <b>≥30 mentions and ≥3× the prior 20 archive days'
      median</b>, at most one per ticker every six archive days. Returns are measured in
      <b>sessions</b> from the first session at or after the spike, which is why the chart
      windows are +5d/+10d/+20d and not calendar weeks. The benchmark is the same tickers on a
      random non-spike day, never zero — this basket outruns SPY unaided, so "it fell" on its
      own is close to no information.</p>
    ${RANK?rankHTML():''}
    <p class="note">Sources: ApeWisdom for attention, stockanalysis with a Yahoo fallback for
      prices, Cboe for the market gauges. Wayback captures of the ApeWisdom board for anything
      before 2026-05. Everything is archived to the repository first and read from there — the
      page never queries a data source live.</p>`;
}

/* Reported whatever it said. It does not reproduce the headline, and that is the
   result: the effect lives in the *change* in attention, not the level of it. */

      captures reach 2021 but are far too sparse for the spike definition, which needs the prior
      20 archive days to actually be 20 days. So this asks something decidable from a single
      snapshot — <b>a ticker holding a top-3 spot that day</b> — by the same code over both
      datasets. Eleven frozen days are excluded.</p>
    ${RANK.datasets.map(d=>tbl(d,'top3','rest_of_board')).join('')}
    <h3>By year, ten sessions</h3>
    <div class="tblwrap"><table><thead><tr><th>year</th><th class="n">days</th><th class="n">n</th>

    <p class="note"><b>It does not reproduce the headline, and the sign is not stable.</b> Being

      roughly seven points for a confirmed spike on the same 2026 data. By year the gap runs
      -1.29, +1.82, -2.57, -0.58, +0.55: it changes sign. Read together, the two say the effect is
      in the <b>change</b> in attention, not its level — and that even the level effect is not

}

function marketHTML(){
  if(!RISK&&!DIXROWS)return `<div class="dHead"><div><div class="dTk">Market</div>
    <p class="dSub">Systemic gauges, independent of the attention archive.</p></div></div>
    <p class="note">Loading market gauges…</p>`;

  const R=({'3M':63,'1Y':252,'2Y':504,'5Y':1260,'ALL':null})[MWIN];
  const cut=a=>R==null?a:a.slice(-R);
  const bar=`<div class="winbar"><span class="mut" style="font-size:11.5px">range</span>
    <div class="chips">${['3M','1Y','2Y','5Y','ALL'].map(k=>
      `<button data-mwin="${k}" aria-pressed="${MWIN===k}">${k}</button>`).join('')}</div></div>`;

  let out=`<div class="dHead"><div><div class="dTk">Market</div>
    <p class="dSub">Systemic gauges, independent of the attention archive.</p></div></div>${bar}`;

  if(DIXROWS&&DIXROWS.length){
    const rows=cut(DIXROWS);
    /* Still DIX.csv — column 3 is GEX. The dark-pool column beside it is simply not
       read; dropping the file would drop the fifteen years of GEX with it. */
    const d=rows.map(r=>r[0]), gx=rows.map(r=>+r[3]/1e9);
    const g=gx[gx.length-1];
    const pos=g>=0;
    /* The sign is the whole reading, so it is stated in colour, in words and by the
       zero axis on the chart. One flat line and a bare number said none of it. */
    out+=`<h3>GEX · dealer gamma <span class="mut" style="font-weight:400">(SqueezeMetrics official)</span></h3>
      <div class="gauge ${pos?'gpos':'gneg'}">
        <div class="gv ${pos?'up':'dn'}">${pos?'+':''}${g.toFixed(1)}B</div>
        <div class="gtxt"><b>${pos?'Positive gamma':'Negative gamma'}</b> —
          ${pos?'hedging flows dampen moves; the market tends to pin':'hedging flows amplify moves; a fragile regime'}
          <span class="mut">· as of ${d[d.length-1]}</span></div>
      </div>
      <div class="chartbox">${chart(d,null,gx,'',760,200,'',{sign:true})}
        <div class="cLegend"><span><i style="background:var(--up)"></i>above zero · volatility suppressed</span>
          <span><i style="background:var(--dn)"></i>below zero · volatility amplified</span>
          <span class="hoverHint">hover for any day's value</span></div>
        <p class="note">${rows.length} sessions · ${d[0]} → ${d[d.length-1]} ·
          ${gx.filter(v=>v<0).length} of them below zero.</p></div>`;

  }

  if(RISK&&RISK.dates&&RISK.dates.length){
    const dd=cut(RISK.dates), sk=cut(RISK.skew);
    const last=sk[sk.length-1];
    const p=Math.round(sk.filter(v=>v<last).length/sk.length*100);
    out+=`<h3>SKEW · black-swan index</h3>
      <div class="gauge"><div class="gv">${last.toFixed(2)}</div>
        <div class="gtxt">P${p} over this window · long-run centre is about 120; ≥140 means crowded
          tail-hedge demand. <span class="mut">· ${dd[dd.length-1]}</span></div></div>
      <div class="chartbox">${chart(dd,null,sk,'',760,180,'')}
        <p class="note">The price of panic insurance. Its predictive power for forward returns has
          always been weak — an environment gauge, not a signal.</p></div>`;
  }
  return out;
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  /* No writeURL here — render() ends in writeURL(push=true) already, and calling both
        pushed the same URL twice, so the first press of Back appeared to do nothing. */
  const cell=e.target.closest('[data-spkset]');
  if(cell){const[f,m]=cell.dataset.spkset.split('|').map(Number);
    SPK.floor=f;SPK.mult=m;applySpike();SEL=null;SHOWN=40;render();return;}
  if(e.target.closest('[data-spkrst]')){
    SPK={...SPK0};applySpike();SEL=null;SHOWN=40;render();return;}
  const lens=e.target.closest('[data-lens]');
  if(lens){
    if(lens.dataset.lens!==VIEW){VIEW=lens.dataset.lens;SEL=null;ONLY='';SHOWN=40;render();}
    return;
  }
  const v=e.target.closest('[data-v]');
  if(v&&v.dataset.v==='stocks'){
    /* Returns to whichever lens was last used rather than always the board — coming
       back should land where you left. */
    if(VIEW!=='today'&&VIEW!=='aftermath'){VIEW=LASTLENS;SEL=null;SHOWN=40;render();}
    return;
  }
  if(v){
    /* Carry the ticker across, but not the same way in both directions.
    
       Board → Aftermath filters: you want that ticker's spike history, and a list of
       one ticker's events is a sensible thing.
       
       Aftermath → Board selects instead: you want to see where it sits among
       everything, and a board narrowed to one row is not a board. Filtering both ways
       made Board open with "All 1" and every group reading zero. */
    const carry=SEL&&(VIEW==='today'?SEL:String(SEL).split('|')[1]);
    const from=VIEW;
    VIEW=v.dataset.v;SEL=null;SHOWN=40;
    if(carry&&VIEW==='aftermath'&&from==='today')Q=carry;
    else if(carry&&VIEW==='today'&&from==='aftermath'){Q='';SEL=carry;}
    render();return;
  }
  const cb=e.target.closest('#claimBar');
  if(cb){
    const open=cb.getAttribute('aria-expanded')!=='true';
    cb.setAttribute('aria-expanded',String(open));
    $('claimBody').hidden=!open;
    /* Remembered, because a reader who folded it away meant it. */
    try{localStorage.setItem('claimOpen',open?'1':'0');}catch(_){}
    return;
  }
  if(e.target.closest('[data-back]')){$('pane').classList.remove('showDetail');return;}
  const s=e.target.closest('[data-sort]');
  if(s){SORT=s.dataset.sort;SHOWN=40;render();return;}
  const o=e.target.closest('[data-only]');
  if(o){ONLY=o.dataset.only;SHOWN=40;render();return;}
  const drop=e.target.closest('[data-drop]');
  if(drop){
    const k=drop.dataset.drop;
    if(k==='all'){Q='';ONLY='';SORT='res';if(DAYS.length)DAY=DAYS[DAYS.length-1];}
    if(k==='q')Q='';
    if(k==='only')ONLY='';
    if(k==='sort')SORT='res';
    if(k==='day'&&DAYS.length)DAY=DAYS[DAYS.length-1];
    SHOWN=40;SEL=null;
    (async()=>{await loadDays([DAY]);render();})();
    return;
  }
  const hz=e.target.closest('[data-hz]');
  /* '' rather than 'closed': no filter branch handles 'closed', so it fell through to
     an unfiltered list under a chip row where nothing was pressed. Sorting by worst
     already puts the resolved ones first, which is what the row promised. */
  if(hz){VIEW='aftermath';WIN=hz.dataset.hz+'d';ONLY='';SORT='worst';
    SEL=null;SHOWN=40;render();return;}
  const jp=e.target.closest('[data-jump]');
  if(jp){VIEW='aftermath';SEL=jp.dataset.jump;SHOWN=40;ONLY='';Q='';$('q').value='';
    render();$('pane').classList.add('showDetail');
    const r=$('list').querySelector(`[data-k="${CSS.escape(SEL)}"]`);
    if(r)r.scrollIntoView({block:'center'});return;}
  const mw=e.target.closest('[data-mwin]');
  if(mw){MWIN=mw.dataset.mwin;$('detail').innerHTML=marketHTML();writeURL(true);return;}
  const w=e.target.closest('[data-win]');
  if(w){WIN=w.dataset.win;renderDetail();writeURL(true);return;}
  const tw=e.target.closest('[data-twin]');
  if(tw){
    /* Paints what is in memory at once — a five-year range wants a 3.4 MB price file
       and up to 230 crawl snapshots — and renderDetail schedules the rest. */
    TWIN=tw.dataset.twin; TWINSET=true; renderDetail(); writeURL(true);
    return;
  }
  if(e.target.closest('#more')){SHOWN+=40;renderList();return;}
  if(e.target.closest('#csv')){exportCSV();return;}
  const row=e.target.closest('.row');
  if(row){SEL=row.dataset.k;markSel();renderDetail();writeURL(true);
    $('pane').classList.add('showDetail');}
});
/* One delegated handler for every chart on the page. Per-chart listeners would leak
   on each redraw, and a redraw happens on every window change. */
function chartHover(e){
  const svg=e.target.closest?.('svg[data-ch]');
  const box=e.target.closest?.('.chartbox');
  if(!svg||!box){hideTip(box);return;}
  const C=CHARTS[svg.dataset.ch]; if(!C){hideTip(box);return;}
  const r=svg.getBoundingClientRect();
  if(!r.width)return;
  /* The SVG scales to the container, so client pixels have to go back through the
     viewBox before they mean anything in chart coordinates. */
  const vx=(e.clientX-r.left)/r.width*C.w;
  /* Nearest by actual x, not by inverting even spacing. The old arithmetic assumed
     every point was the same distance from its neighbour, which stops being true the
     moment a chart uses a time axis — the crosshair would land days or, on a
     five-year range, months from the pointer. */
  let i=0,best=Infinity;
  for(let k=0;k<C.n;k++){const dd=Math.abs(C.xs[k]-vx); if(dd<best){best=dd;i=k;}}
  const d=C.days[i], px=C.prices[i], mn=C.mentions?C.mentions[i]:null;

  const cross=svg.querySelector('.chCross');
  if(cross){cross.setAttribute('x1',C.x(i));cross.setAttribute('x2',C.x(i));cross.setAttribute('opacity','.45');}
  svg.querySelectorAll('.chDot').forEach(c=>c.setAttribute('opacity',+c.dataset.i===i?'1':'0'));

  let tip=box.querySelector('.chTip');
  if(!tip){tip=document.createElement('div');tip.className='chTip';box.appendChild(tip);}
  const ok=settled(d);
  const isSpk=C.spikes&&C.spikes.has(d);
  tip.innerHTML=`<div class="d">${d}${isSpk?' <span class="warn">▲ spike</span>':''}</div>`
    +(px!=null?`<div>${C.unit==='$'?'price':'value'} <span class="v">${C.unit}${px.toFixed(px<10?2:2)}</span></div>`
              :`<div class="mut">no session that day</div>`)
    +(C.mentions?(mn!=null?`<div>mentions <span class="v">${mn.toLocaleString()}</span></div>`
       :`<div class="mut">not on the board that day</div>`):'')
    +(C.mentions&&mn!=null?`<div class="${ok?'mut':'warn'}">read ${capLabel(d)}${ok?'':' · before the close'}</div>`:'');
  tip.classList.add('on');
  /* Clamp inside the box so the readout never gets cut off at either edge. */
  const bw=box.getBoundingClientRect(), tw=tip.offsetWidth||150;
  let left=e.clientX-bw.left+14;
  if(left+tw>bw.width-8)left=e.clientX-bw.left-tw-14;
  tip.style.left=Math.max(8,left)+'px';
  tip.style.top=Math.max(8,e.clientY-bw.top-tip.offsetHeight-12)+'px';
}
function hideTip(box){
  document.querySelectorAll('.chTip.on').forEach(t=>t.classList.remove('on'));
  document.querySelectorAll('svg[data-ch] .chCross').forEach(c=>c.setAttribute('opacity','0'));
  document.querySelectorAll('svg[data-ch] .chDot').forEach(c=>c.setAttribute('opacity','0'));
}
/* `input`, not `change`: the point of a slider here is watching the event count and
   the gap move while you drag. The scan is a few milliseconds over 1,860 tickers, so
   it can keep up — but writeURL is deliberately left to `change`, or a single drag
   would push forty history entries and bury the real steps. */
document.addEventListener('input',e=>{
  const r=e.target.closest?.('[data-spk]'); if(!r)return;
  if(SCANOK===null)return;
  SPK[r.dataset.spk]=+r.value; applySpike(); SEL=null; SHOWN=40;
  /* Deliberately not render(): that rebuilds #listctl — destroying this very input —
     and its writeURL defaults to push, so one drag would bury the real steps under
     forty history entries. The three things a drag changes are updated in place. */
  const lab=r.parentElement.querySelector('b');
  if(lab)lab.textContent=r.value+(r.dataset.spk==='mult'?'×':'');
  const read=document.querySelector('.spkRead');
  if(read)read.innerHTML=spkReadout(true);
  const f=FINDING&&(FINDING.horizons||[]).find(h=>h.sessions===(FINDING.headline_sessions||20));
  $('claimLine').innerHTML=claimLineHTML(f);
  renderList();
});
/* On release, not during: a full render refreshes the group counts the drag left stale
   and writes one history entry for the whole gesture. */
document.addEventListener('change',e=>{
  const r=e.target.closest?.('[data-spk]'); if(!r)return;
  /* Chrome commits a range on every arrow keypress, so the keyboard fires change per
     press — and render() rebuilds #listctl, replacing this element and dropping focus to
     <body>. That did more than make the next press inert: with the target no longer an
     input, the global ArrowLeft binding took over and ran history.back(), restoring the
     value just set. Arrow keys oscillated 37→36→37 and filled the history with it.
     Re-focusing is a no-op unless the element had focus, which is exactly the keyboard
     case — a pointer drag is unaffected. */
  const k=r.dataset.spk, keep=document.activeElement===r;
  render(true);
  if(keep)document.querySelector(`[data-spk="${k}"]`)?.focus();
});
document.addEventListener('pointermove',chartHover);
document.addEventListener('pointerleave',()=>hideTip(),true);
document.addEventListener('pointerdown',chartHover);

document.addEventListener('keydown',e=>{
  /* `e.target` is not always an element — a key pressed with nothing focused targets
     `document`, which has no .matches, and the throw took the whole handler with it. */
  if(e.target&&e.target.matches&&e.target.matches('input,select'))return;
  if(e.key==='j'||e.key==='k'||e.key==='ArrowDown'||e.key==='ArrowUp'){
    const rows=[...$('list').querySelectorAll('.row')];
    const i=rows.findIndex(r=>r.dataset.k===SEL);
    const j=Math.max(0,Math.min(rows.length-1,i+((e.key==='j'||e.key==='ArrowDown')?1:-1)));
    /* Arrowing through a list is scanning, not navigating — one history entry per
       keypress would make Back mean "up one row" twenty times over. */
    if(rows[j]){SEL=rows[j].dataset.k;markSel();renderDetail();writeURL(false);
      rows[j].scrollIntoView({block:'nearest'});e.preventDefault();}
  }
  if(e.key==='/'){$('q').focus();e.preventDefault();}
  if(e.key==='ArrowLeft'){history.back();e.preventDefault();}
});
document.addEventListener('change',async e=>{
  if(e.target&&e.target.id==='day2'){
    DAY=e.target.value;SEL=null;
    if(!DAYS.includes(DAY)){await ensureHist();await loadDays([DAY,...WBDAYS.filter(d=>d<=DAY).slice(-40)]);}
    else await loadDays([DAY]);
    render();
  }
});
$('q').addEventListener('input',e=>{Q=e.target.value.toUpperCase();SHOWN=40;SEL=null;
  if(VIEW!=='market')render(false);});

function exportCSV(){
  const L=eventRows();
  const cols=[['date',e=>e.d],['ticker',e=>e.tk],['in_basket',e=>BASKET.has(e.tk)?'yes':'no'],
    ['mentions_spike_day',e=>e.m],['prior_20d_median',e=>e.med.toFixed(1)],
    ['multiple',e=>(e.m/Math.max(e.med,1)).toFixed(1)],
    ['read_at_utc',e=>capLabel(e.d)],['settled_after_close',e=>settled(e.d)?'yes':'no'],
    ['ret_5d_pct',e=>e.r5==null?'':e.r5.toFixed(2)],
    ['ret_10d_pct',e=>e.r10==null?'':e.r10.toFixed(2)],
    ['ret_20d_pct',e=>e.r20==null?'':e.r20.toFixed(2)]];
  const cell=v=>{const t=String(v??'');return /[",\n]/.test(t)?'"'+t.replace(/"/g,'""')+'"':t;};
  const csv=[cols.map(c=>c[0]).join(',')].concat(L.map(e=>cols.map(c=>cell(c[1](e))).join(','))).join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download=`salience-spikes-${DAY}.csv`;a.click();
}
