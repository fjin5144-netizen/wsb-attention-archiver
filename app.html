<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Salience</title>
<!--
  App-shell variant of index.html. Same data files, different container.

  What it is trying to fix, all of it measured on the page it replaces:

    * the document scrolled 6,009px on Today and 4,427px on Aftermath, where the
      first event card sat at y=2,165 — 2.6 phone screens past the top
    * 156 controls and 463 numbers on one surface, every card the same weight, so
      deciding what mattered was left to the reader
    * one chart per card, thirty at a time, all of them built whether looked at or not

  So: a fixed shell that never scrolls, one scrolling pane inside it, and
  list-then-detail instead of a stack. Only the selected row draws a chart.

  Charts are inline SVG rather than Chart.js — no CDN on the critical path, no
  canvas to wait for, and a redraw costs a string concat.
-->
<style>
:root{
  --bg:#0e0f12; --sunk:#111318; --card:#161920; --line:#252932; --line2:#2f343f;
  --ink:#e8eaf0; --ink2:#a8aeba; --ink3:#767d8b;
  --acc:#8b7cf6; --up:#3fbf8f; --dn:#f2685c; --warn:#eda100;
  --bar:#3a3f4c; --r:10px;
  --sans:ui-sans-serif,-apple-system,"SF Pro Text",Inter,Segoe UI,Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --top:54px; --rail:272px;
}
@media (prefers-color-scheme:light){
  :root{--bg:#f6f7f9;--sunk:#eef0f4;--card:#fff;--line:#e0e3ea;--line2:#cfd4de;
    --ink:#14161b;--ink2:#4d5462;--ink3:#79808e;--bar:#c8cdd8;}
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font:400 14px/1.5 var(--sans);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
.num{font-variant-numeric:tabular-nums}
.up{color:var(--up)} .dn{color:var(--dn)} .mut{color:var(--ink3)}

/* ---- shell: the whole point. Nothing outside .pane ever scrolls. ---- */
.app{height:100dvh;display:grid;grid-template-columns:var(--rail) 1fr;
  grid-template-rows:var(--top) 1fr;grid-template-areas:"top top" "rail pane"}
.topbar{grid-area:top;display:flex;align-items:center;gap:14px;padding:0 16px;
  background:var(--sunk);border-bottom:1px solid var(--line);min-width:0}
.rail{grid-area:rail;background:var(--sunk);border-right:1px solid var(--line);
  overflow-y:auto;overscroll-behavior:contain;padding:14px}
.pane{grid-area:pane;overflow:hidden;min-width:0;display:grid;
  grid-template-columns:minmax(300px,390px) 1fr;grid-template-areas:"list detail"}
.pane.single{grid-template-columns:1fr;grid-template-areas:"detail"}
.list{grid-area:list;overflow-y:auto;overscroll-behavior:contain;
  border-right:1px solid var(--line);min-width:0}
.detail{grid-area:detail;overflow-y:auto;overscroll-behavior:contain;padding:18px 22px;min-width:0}

.brand{font:650 16px/1 var(--sans);letter-spacing:-.02em;white-space:nowrap}
.brand span{display:block;font:400 10.5px/1.3 var(--sans);color:var(--ink3);margin-top:3px}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:2px}
.seg button{border:0;background:none;color:var(--ink3);font:550 12.5px/1 var(--sans);
  padding:7px 13px;border-radius:6px;white-space:nowrap}
.seg button[aria-selected=true]{background:var(--acc);color:#fff}
.spacer{flex:1;min-width:0}
.tbctl{display:flex;align-items:center;gap:8px;min-width:0}
.tbctl select,.tbctl input{background:var(--bg);border:1px solid var(--line);border-radius:7px;
  padding:6px 9px;font-size:12.5px;min-width:0}
.tbctl input{width:118px;text-transform:uppercase;letter-spacing:.03em}
.tbctl input::placeholder{text-transform:none;color:var(--ink3)}
.stale{color:var(--warn)}

/* ---- rail ---- */
.rk{font:600 10.5px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink3);margin:0 0 9px}
.finding{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--acc);
  border-radius:var(--r);padding:13px 14px;margin:0 0 14px}
.fLead{font-size:13px;line-height:1.55;color:var(--ink2);margin:0}
.fLead b{color:var(--ink);font-weight:650}
.fRow{display:flex;justify-content:space-between;gap:8px;padding:6px 0;
  border-top:1px solid var(--line);font-size:12px;margin-top:8px}
.fRow:first-of-type{margin-top:10px}
.fCav{font-size:11.5px;line-height:1.55;color:var(--ink3);margin:11px 0 0;
  padding-top:10px;border-top:1px solid var(--line)}
.fld{margin:0 0 13px}
.fld label{display:block;font-size:11.5px;color:var(--ink3);margin:0 0 5px}
.fld select,.fld input{width:100%;background:var(--card);border:1px solid var(--line);
  border-radius:7px;padding:7px 9px;font-size:12.5px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chips button{background:var(--card);border:1px solid var(--line);border-radius:6px;
  padding:5px 9px;font-size:11.5px;color:var(--ink2)}
.chips button[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:#fff}
.railBtn{width:100%;background:var(--card);border:1px solid var(--line);border-radius:7px;
  padding:8px;font-size:12px;color:var(--ink2)}

/* ---- list ---- */
.listHead{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--line);
  padding:9px 14px;font-size:11.5px;color:var(--ink3);display:flex;gap:8px;align-items:center}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;
  padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer;border-left:2px solid transparent}
.row:hover{background:var(--sunk)}
.row[aria-selected=true]{background:var(--sunk);border-left-color:var(--acc)}
/* All three placed explicitly. `.out` carries a grid-row, and items with a definite
   row are placed before auto-placed ones — so it claimed column 1 and shoved the
   ticker into column 2, which is how the first render came out mirrored. */
.row .r1{grid-column:1;grid-row:1;display:flex;align-items:baseline;gap:7px;min-width:0}
.row .tk{font:650 13.5px/1 var(--sans);letter-spacing:-.01em}
.row .dt{font-size:11px;color:var(--ink3)}
.row .r2{grid-column:1;grid-row:2;font-size:11.5px;color:var(--ink3);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.row .out{grid-column:2;grid-row:1/3;font:650 14px/1 var(--sans);text-align:right;
  align-self:center;white-space:nowrap}
.badge{font:600 9.5px/1 var(--sans);letter-spacing:.04em;text-transform:uppercase;
  padding:3px 5px;border-radius:4px;background:var(--line2);color:var(--ink2)}
.badge.b{background:rgba(139,124,246,.18);color:var(--acc)}
.more{display:block;width:100%;background:none;border:0;border-top:1px solid var(--line);
  padding:12px;color:var(--ink3);font-size:12px}

/* ---- detail ---- */
.dHead{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;margin:0 0 4px}
.dTk{font:650 25px/1.1 var(--sans);letter-spacing:-.022em}
.dSub{font-size:12.5px;color:var(--ink3);margin:2px 0 0}
.dOut{margin-left:auto;text-align:right}
.dOut .v{font:650 27px/1 var(--sans);letter-spacing:-.02em}
.dOut .k{font-size:11px;color:var(--ink3);margin-top:3px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:1px;
  background:var(--line);border:1px solid var(--line);border-radius:var(--r);
  overflow:hidden;margin:16px 0}
.stat{background:var(--card);padding:10px 12px}
.stat .k{font-size:10.5px;color:var(--ink3);letter-spacing:.02em}
.stat .v{font:600 15px/1.2 var(--sans);margin-top:3px}
.chartbox{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.chartbox svg{display:block;width:100%;height:auto}
.cLegend{display:flex;flex-wrap:wrap;gap:14px;font-size:11px;color:var(--ink3);margin:10px 0 0}
.cLegend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.winbar{display:flex;align-items:center;gap:8px;margin:12px 0 0;flex-wrap:wrap}
.note{font-size:12px;line-height:1.6;color:var(--ink3);margin:11px 0 0}
.empty{display:grid;place-items:center;height:100%;color:var(--ink3);font-size:13px;text-align:center;padding:30px}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:12.5px;min-width:420px}
th,td{padding:8px 11px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{position:sticky;top:0;background:var(--sunk);font:600 11px/1 var(--sans);
  letter-spacing:.03em;text-transform:uppercase;color:var(--ink3);z-index:1}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
h3{font:600 13px/1 var(--sans);letter-spacing:.01em;margin:22px 0 10px}
h3:first-child{margin-top:0}

.loading{position:fixed;inset:var(--top) 0 0 0;display:grid;place-items:center;
  background:var(--bg);z-index:50;color:var(--ink3);font-size:13px}
.bar{width:180px;height:3px;background:var(--line);border-radius:2px;margin-top:12px;overflow:hidden}
.bar i{display:block;height:100%;width:30%;background:var(--acc);border-radius:2px;
  animation:sl 1.1s ease-in-out infinite}
@keyframes sl{0%{transform:translateX(-100%)}100%{transform:translateX(400%)}}

.mtabs{display:none}
.railClose{display:none}
@media (max-width:900px){
  :root{--top:50px}
  .app{grid-template-columns:1fr;grid-template-rows:var(--top) 1fr auto;
    grid-template-areas:"top" "pane" "tabs"}
  /* The rail becomes a sheet rather than a column. It holds the finding and the
     filters, which on a phone are a thing you open, decide, and close. */
  .rail{position:fixed;inset:var(--top) 0 0 0;z-index:40;border-right:0;
    transform:translateY(100%);transition:transform .22s ease;padding-bottom:80px}
  .rail.open{transform:translateY(0)}
  .railClose{display:block;width:100%;margin:6px 0 14px;background:var(--card);
    border:1px solid var(--line);border-radius:7px;padding:9px;font-size:12.5px;color:var(--ink2)}
  /* List and detail stop being side by side and become two states of one pane —
     the phone equivalent of the same master-detail idea. */
  .pane{grid-template-columns:1fr;grid-template-areas:"list"}
  .pane .detail{display:none}
  .pane.showDetail{grid-template-areas:"detail"}
  .pane.showDetail .list{display:none}
  .pane.showDetail .detail{display:block;padding:15px}
  .pane.single .list{display:none}
  .pane.single{grid-template-areas:"detail"}
  .pane.single .detail{display:block}
  .mtabs{grid-area:tabs;display:grid;grid-auto-flow:column;background:var(--sunk);
    border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
  .mtabs button{border:0;background:none;color:var(--ink3);font:550 11px/1 var(--sans);
    padding:11px 4px 12px;display:grid;gap:5px;justify-items:center}
  .mtabs button[aria-selected=true]{color:var(--acc)}
  .mtabs .g{font-size:15px;line-height:1}
  .topbar .seg{display:none}
  .brand span{display:none}
  .dTk{font-size:21px}
  .back{display:inline-flex;align-items:center;gap:6px;background:none;border:0;
    color:var(--acc);font-size:12.5px;padding:0 0 10px}
}
@media (min-width:901px){.back{display:none}}
</style></head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">Salience<span>Retail attention on r/wallstreetbets</span></div>
    <div class="seg" role="tablist" id="seg">
      <button role="tab" data-v="today" aria-selected="true">Today</button>
      <button role="tab" data-v="aftermath" aria-selected="false">Aftermath</button>
      <button role="tab" data-v="market" aria-selected="false">Market</button>
    </div>
    <div class="spacer"></div>
    <div class="tbctl">
      <input id="q" type="search" placeholder="ticker" aria-label="Filter by ticker" autocomplete="off">
      <select id="day" aria-label="Archive date"></select>
    </div>
  </header>
  <aside class="rail" id="rail">
    <button class="railClose" id="railClose">Done</button>
    <div id="railBody"></div>
  </aside>
  <main class="pane" id="pane">
    <div class="list" id="list"></div>
    <div class="detail" id="detail"></div>
  </main>
  <nav class="mtabs" id="mtabs" role="tablist">
    <button role="tab" data-v="today" aria-selected="true"><span class="g">▦</span>Today</button>
    <button role="tab" data-v="aftermath" aria-selected="false"><span class="g">◷</span>Aftermath</button>
    <button role="tab" data-v="market" aria-selected="false"><span class="g">◈</span>Market</button>
    <button data-rail="1"><span class="g">⚙</span>Filters</button>
  </nav>
</div>
<div class="loading" id="boot">Loading the archive<div class="bar"><i></i></div></div>
<script>
const OWNER='fjin5144-netizen', REPO='wsb-attention-archiver';
const LOCAL=location.protocol==='file:';
const BASE=LOCAL?`https://raw.githubusercontent.com/${OWNER}/${REPO}/main/`:'';
const HOT_FLOOR=30, HOT_X=3, CLOSE_UTC=21;
const BASKET=new Set(["GME","AMC","MSTR","PLTR","RKLB","SOFI","TSLA","NVDA","AMD","INTC","HOOD","COIN","RDDT","SMCI","IONQ","RGTI","QUBT","BBAI","SOUN","AI","CRWV","NBIS","TEM","ACHR","JOBY","LUNR","ASTS","SPCE","OKLO","SMR","MARA","RIOT","CLSK","WULF","DJT","OPEN","CVNA","UPST","AFRM","HIMS","TLRY","RUM","QS","BB","NOK","NIO","RIVN","LCID","PLUG","W","NVAX"]);
const WINS={'5d':5,'10d':10,'20d':20,'all':null};

let DAYS=[],EVENTS=[],FINDING=null,PRICES={},RISK=null,SNAP={},DAY='',
    VIEW='today',SEL=null,Q='',WIN='10d',SORT='new',ONLY='',SHOWN=40;

const $=id=>document.getElementById(id);
const gj=async u=>{const r=await fetch(u);if(!r.ok)throw new Error(r.status);return r.json();};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pct=v=>(v>0?'+':'')+v.toFixed(1)+'%';
const cls=v=>v==null?'mut':v<0?'dn':'up';
const median=a=>{if(!a.length)return 0;const s=[...a].sort((x,y)=>x-y),m=s.length>>1;
  return s.length%2?s[m]:(s[m-1]+s[m])/2;};

/* Capture time, same rule the main site uses: a day read before the close covers a
   different 24h window than its neighbours, so its totals are not comparable and a
   short bar is not a quiet day. */
const capAt=d=>{const t=(SNAP[d]||{}).fetched_at;if(!t)return null;
  const x=new Date(t);return isNaN(x)?null:x;};
const settled=d=>{const x=capAt(d);return x?x.getUTCHours()>=CLOSE_UTC:true;};
const capLabel=d=>{const x=capAt(d);return x?`${String(x.getUTCHours()).padStart(2,'0')}:${String(x.getUTCMinutes()).padStart(2,'0')} UTC`:'unknown';};
const rowsOf=d=>((SNAP[d]||{}).filters||{}).wallstreetbets||[];
const MAPS={};
const mapOf=d=>{if(d in MAPS)return MAPS[d];
  const m={};for(const r of rowsOf(d))m[r.ticker]=r.mentions;return MAPS[d]=m;};
const mOf=(d,tk)=>mapOf(d)[tk]||0;

/* Sessions, read off the price series — the same fix the main chart needed. A window
   counted in calendar days cannot contain the return it is captioned with, because a
   spike can land on a weekend and holidays shift the rest. */
function priceIdx(tk,d){const p=PRICES[tk];if(!p)return[null,-1];
  const i=p.d.indexOf(d);if(i>=0)return[p,i];
  const j=p.d.findIndex(x=>x>d);return j>0?[p,j]:[null,-1];}
function ret(tk,d,n){const[p,i]=priceIdx(tk,d);
  if(!p||i<0||i+n>=p.c.length||!p.c[i])return null;
  return (p.c[i+n]/p.c[i]-1)*100;}

/* ---------- boot ---------- */
(async()=>{
  try{
    DAYS=await gj(`${BASE}data/days.json`);
  }catch(e){
    try{const j=await gj(`https://api.github.com/repos/${OWNER}/${REPO}/contents/data/apewisdom`);
      DAYS=j.map(x=>x.name.replace('.json','')).filter(n=>/^\d{4}-\d{2}-\d{2}$/.test(n)).sort();}
    catch(_){DAYS=[];}
  }
  if(!DAYS.length){$('boot').textContent='No archive data yet.';return;}
  const [ev,fi,px]=await Promise.all([
    gj(`${BASE}data/events.json`).catch(()=>[]),
    gj(`${BASE}data/finding.json`).catch(()=>null),
    gj(`${BASE}data/prices.json`).catch(()=>({})),
  ]);
  EVENTS=ev;FINDING=fi;PRICES=px;
  DAY=DAYS[DAYS.length-1];
  await loadDays([DAY]);
  /* Land on a day that has rows. A run can commit before the fetch returns, and an
     empty newest day would blank the whole shell. */
  for(let i=DAYS.length-1;i>=0&&!rowsOf(DAY).length;i--){DAY=DAYS[i];await loadDays([DAY]);}
  $('day').innerHTML=DAYS.slice().reverse().map(d=>`<option value="${d}">${d}</option>`).join('');
  $('day').value=DAY;
  readURL();
  $('boot').remove();
  render();
  /* The rest streams in behind the shell: mention history needs every snapshot, but
     nothing on first paint does. */
  loadDays(DAYS).then(()=>{if(VIEW!=='market')render();});
  gj(`${BASE}data/risk.json`).then(r=>{RISK=r;if(VIEW==='market')render();}).catch(()=>{});
})();

async function loadDays(list){
  const todo=list.filter(d=>!(d in SNAP));
  for(let i=0;i<todo.length;i+=12){
    await Promise.all(todo.slice(i,i+12).map(async d=>{
      try{SNAP[d]=await gj(`${BASE}data/apewisdom/${d}.json`);}catch(e){SNAP[d]=null;}
      delete MAPS[d];
    }));
  }
}

/* ---------- url state ---------- */
function writeURL(){
  const p=new URLSearchParams();
  if(VIEW!=='today')p.set('v',VIEW);
  if(SEL)p.set('sel',SEL);
  if(Q)p.set('q',Q);
  if(WIN!=='10d')p.set('w',WIN);
  if(SORT!=='new')p.set('sort',SORT);
  if(ONLY)p.set('only',ONLY);
  if(DAY!==DAYS[DAYS.length-1])p.set('d',DAY);
  history.replaceState(null,'',p.toString()?'?'+p:location.pathname);
}
function readURL(){
  const p=new URLSearchParams(location.search);
  if(['today','aftermath','market'].includes(p.get('v')))VIEW=p.get('v');
  SEL=p.get('sel')||null; Q=(p.get('q')||'').toUpperCase();
  if(p.get('w') in WINS)WIN=p.get('w');
  if(['new','old','worst','best','mentions'].includes(p.get('sort')))SORT=p.get('sort');
  ONLY=p.get('only')||'';
  if(DAYS.includes(p.get('d')))DAY=p.get('d');
  $('q').value=Q;
}

/* ---------- svg chart ---------- */
/* Hand-rolled rather than Chart.js: one dependency fewer on the critical path, and
   redrawing on every window change is a string concat instead of tearing down and
   rebuilding a canvas. */
/* `mentions` may be null: the market gauges are one series, and the first draft fed
   SKEW through the bar slot with a `v-min+1` rescale, which produced meaningless bars
   and an axis reading 31.52000000000001. A single-series chart is a line, not a
   borrowed one with its other half filled in. */
function chart(days,mentions,prices,spikeDay,w=760,h=230,unit='$'){
  const padL=44,padR=mentions?44:14,padT=12,padB=22;
  const iw=w-padL-padR, ih=h-padT-padB;
  const n=days.length; if(!n)return '';
  const mMax=mentions?Math.max(1,...mentions):1;
  const pv=prices.filter(v=>v!=null);
  const pMin=pv.length?Math.min(...pv):0, pMax=pv.length?Math.max(...pv):1;
  const pSpan=(pMax-pMin)||1;
  const x=i=>padL+(n===1?iw/2:i*iw/(n-1));
  const bw=Math.max(2,Math.min(11,iw/n*0.55));
  let bars='',line='';
  if(mentions)days.forEach((d,i)=>{
    const bh=mentions[i]/mMax*ih*0.82;
    const isSpike=d===spikeDay;
    const ok=settled(d);
    const col=isSpike?'var(--dn)':'var(--bar)';
    bars+=`<rect x="${(x(i)-bw/2).toFixed(1)}" y="${(padT+ih-bh).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(bh,1.5).toFixed(1)}" rx="1.5"`
       +(ok?` fill="${col}"`:` fill="none" stroke="${col}" stroke-width="1"`)
       +`><title>${d} · ${mentions[i]} mentions · read ${capLabel(d)}${ok?' (after the close)':' (BEFORE the close — rolling 24h window, not comparable)'}</title></rect>`;
  });
  let started=false;
  prices.forEach((v,i)=>{
    if(v==null)return;
    const py=padT+ih-((v-pMin)/pSpan)*ih*0.92-ih*0.04;
    line+=(started?'L':'M')+x(i).toFixed(1)+' '+py.toFixed(1)+' ';started=true;
  });
  const si=days.indexOf(spikeDay);
  const marker=si>=0?`<line x1="${x(si).toFixed(1)}" y1="${padT}" x2="${x(si).toFixed(1)}" y2="${padT+ih}" stroke="var(--dn)" stroke-width="1" stroke-dasharray="3 3" opacity=".8"/>`:'';
  const yl=(v,y)=>`<text x="${padL-7}" y="${y}" text-anchor="end" font-size="9.5" fill="var(--ink3)">${v}</text>`;
  const yr=(v,y)=>`<text x="${w-padR+7}" y="${y}" font-size="9.5" fill="var(--ink3)">${v}</text>`;
  const xl=[0,Math.floor((n-1)/2),n-1].filter((v,i,a)=>a.indexOf(v)===i).map(i=>
    `<text x="${x(i).toFixed(1)}" y="${h-6}" text-anchor="middle" font-size="9.5" fill="var(--ink3)">${days[i].slice(5)}</text>`).join('');
  return `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Mentions and price around the spike">
    <line x1="${padL}" y1="${padT+ih}" x2="${w-padR}" y2="${padT+ih}" stroke="var(--line)"/>
    ${marker}${bars}
    ${line?`<path d="${line}" fill="none" stroke="var(--acc)" stroke-width="1.8" stroke-linejoin="round"/>`:''}
    ${pv.length?yl(unit+pMax.toFixed(pMax<10?2:0),padT+10)+yl(unit+pMin.toFixed(pMin<10?2:0),padT+ih-2):''}
    ${mentions?yr(mMax,padT+10)+yr('0',padT+ih-2):''}${xl}
  </svg>`;
}

/* ---------- views ---------- */
function eventRows(){
  let L=EVENTS.map(e=>({...e,r5:ret(e.tk,e.d,5),r10:ret(e.tk,e.d,10),r20:ret(e.tk,e.d,20)}));
  if(Q)L=L.filter(e=>e.tk.includes(Q));
  if(ONLY==='basket')L=L.filter(e=>BASKET.has(e.tk));
  if(ONLY==='closed')L=L.filter(e=>e.r10!=null);
  if(ONLY==='pending')L=L.filter(e=>e.r10==null);
  const O={new:(a,b)=>b.d.localeCompare(a.d),old:(a,b)=>a.d.localeCompare(b.d),
    worst:(a,b)=>(a.r10??1e9)-(b.r10??1e9),best:(a,b)=>(b.r10??-1e9)-(a.r10??-1e9),
    mentions:(a,b)=>b.m-a.m};
  return L.sort(O[SORT]||O.new);
}
function boardRows(){
  let L=rowsOf(DAY).map(r=>{
    const prior=DAYS.filter(d=>d<DAY).slice(-20);
    const med=prior.length?median(prior.map(d=>mOf(d,r.ticker))):0;
    return {...r,med,x:r.mentions/Math.max(med,1),
      hot:r.mentions>=HOT_FLOOR&&r.mentions>=HOT_X*Math.max(med,1)};
  });
  if(Q)L=L.filter(r=>r.ticker.includes(Q));
  if(ONLY==='basket')L=L.filter(r=>BASKET.has(r.ticker));
  if(ONLY==='closed')L=L.filter(r=>r.hot);
  const O={new:(a,b)=>a.rank-b.rank,old:(a,b)=>b.rank-a.rank,
    mentions:(a,b)=>b.mentions-a.mentions,
    best:(a,b)=>b.x-a.x,worst:(a,b)=>(b.rank_24h_ago-b.rank)-(a.rank_24h_ago-a.rank)};
  return L.sort(O[SORT]||O.new);
}

function render(){
  $('pane').classList.toggle('single',VIEW==='market');
  document.querySelectorAll('[data-v]').forEach(b=>
    b.setAttribute('aria-selected',String(b.dataset.v===VIEW)));
  renderRail();
  if(VIEW==='market'){$('detail').innerHTML=marketHTML();writeURL();return;}
  renderList();
  renderDetail();
  writeURL();
}

function renderRail(){
  const f=FINDING&&(FINDING.horizons||[]).find(h=>h.sessions===(FINDING.headline_sessions||20));
  const findingHTML=f?`
    <div class="finding">
      <p class="rk">What the archive says</p>
      <p class="fLead">After a confirmed spike, the median return over
        <b>${f.sessions} sessions</b> is <b class="dn">${pct(f.spike.median)}</b>.
        The same tickers on a random day: <b>${pct(f.placebo.median)}</b>.</p>
      ${(FINDING.horizons||[]).map(h=>`<div class="fRow"><span class="mut">${h.sessions} sessions · n=${h.spike.n}</span>
        <span class="num ${h.gap_median<0?'dn':'up'}">${h.gap_median.toFixed(1)} pts</span></div>`).join('')}
      <p class="fCav"><b>Not a finding.</b> ${FINDING.archive_days} days of archive is one quarter —
        too short to split across periods, and that is the test an earlier result failed.</p>
    </div>`:'';
  const sorts=VIEW==='aftermath'
    ? [['new','Newest'],['old','Oldest'],['worst','Worst 10d'],['best','Best 10d'],['mentions','Most mentions']]
    : [['new','Rank'],['mentions','Mentions'],['best','Multiple'],['worst','Rank climb']];
  const onlys=VIEW==='aftermath'
    ? [['','All'],['basket','Basket'],['closed','Closed 10d'],['pending','Pending']]
    : [['','All'],['basket','Basket'],['closed','Spiking']];
  if(VIEW==='market'){$('railBody').innerHTML=findingHTML;return;}
  $('railBody').innerHTML=findingHTML
    +`<div class="fld"><label>Sort</label><div class="chips">${sorts.map(([k,l])=>
       `<button data-sort="${k}" aria-pressed="${SORT===k}">${l}</button>`).join('')}</div></div>`
    +`<div class="fld"><label>Show</label><div class="chips">${onlys.map(([k,l])=>
       `<button data-only="${k}" aria-pressed="${ONLY===k}">${l}</button>`).join('')}</div></div>`
    +(VIEW==='aftermath'?`<button class="railBtn" id="csv">Export what is listed (CSV)</button>`:'');
}

function renderList(){
  const L=VIEW==='aftermath'?eventRows():boardRows();
  const head=`<div class="listHead"><b>${L.length}</b> ${VIEW==='aftermath'?'spikes':'tickers'}
    ${Q?`· filter ${esc(Q)}`:''}${ONLY?` · ${ONLY}`:''}</div>`;
  if(!L.length){$('list').innerHTML=head+`<div class="empty">Nothing matches.</div>`;return;}
  const slice=L.slice(0,SHOWN);
  const body=slice.map(e=>VIEW==='aftermath'?eventRow(e):boardRow(e)).join('');
  const more=L.length>SHOWN?`<button class="more" id="more">Show ${Math.min(40,L.length-SHOWN)} more · ${L.length-SHOWN} left</button>`:'';
  $('list').innerHTML=head+body+more;
  if(!SEL||!slice.some(e=>key(e)===SEL))SEL=key(slice[0]);
  markSel();
}
const key=e=>VIEW==='aftermath'?`${e.d}|${e.tk}`:e.ticker;
function eventRow(e){
  return `<div class="row" role="button" tabindex="0" data-k="${key(e)}">
    <div class="r1"><span class="tk">${e.tk}</span>${BASKET.has(e.tk)?'<span class="badge b">basket</span>':''}
      <span class="dt">${e.d}</span></div>
    <div class="r2">${e.m} mentions · ×${(e.m/Math.max(e.med,1)).toFixed(0)}</div>
    <div class="out ${cls(e.r10)}">${e.r10==null?'<span class="mut" style="font-size:12px">pending</span>':pct(e.r10)}</div>
  </div>`;
}
function boardRow(r){
  const d24=r.mentions-r.mentions_24h_ago, up=r.rank_24h_ago-r.rank;
  return `<div class="row" role="button" tabindex="0" data-k="${r.ticker}">
    <div class="r1"><span class="tk">${r.ticker}</span>${BASKET.has(r.ticker)?'<span class="badge b">basket</span>':''}
      ${r.hot?'<span class="badge" style="background:rgba(242,104,92,.18);color:var(--dn)">spike</span>':''}
      <span class="dt">#${r.rank}</span></div>
    <div class="r2">${r.mentions} mentions · ×${r.x.toFixed(1)} · ${d24>=0?'+':''}${d24} in 24h</div>
    <div class="out ${up>0?'up':up<0?'dn':'mut'}" style="font-size:12.5px">${up>0?'▲':up<0?'▼':'–'}${Math.abs(up)||''}</div>
  </div>`;
}
function markSel(){
  $('list').querySelectorAll('.row').forEach(r=>
    r.setAttribute('aria-selected',String(r.dataset.k===SEL)));
}

function renderDetail(){
  if(!SEL){$('detail').innerHTML='<div class="empty">Pick a row.</div>';return;}
  $('detail').innerHTML=(VIEW==='aftermath'?eventDetail():boardDetail())||'<div class="empty">Not in this view.</div>';
}
/* Always {days, have, priced}. The window ends on the session the return is measured
   to, looked up in the price series rather than counted on a calendar — a spike can
   land on a weekend and holidays move everything after it, so a calendar count cannot
   contain the number it is captioned with. */
function winDays(tk,day,sess){
  if(sess==null)return {days:DAYS.slice(),have:null,priced:true};
  const di=DAYS.indexOf(day);
  if(di<0)return {days:DAYS.slice(-40),have:0,priced:false};
  const pre=Math.max(3,Math.round(sess*7/5/3));
  const[p,i]=priceIdx(tk,day);
  let end=DAYS.length-1, have=0, priced=!!(p&&i>=0);
  if(priced){
    have=Math.max(0,Math.min(sess,p.d.length-1-i));
    if(have>=sess){const k=DAYS.indexOf(p.d[i+sess]);if(k>=0)end=k;}
  }
  return {days:DAYS.slice(Math.max(0,di-pre),end+1),have,priced};
}
function eventDetail(){
  const e=eventRows().find(x=>key(x)===SEL); if(!e)return '';
  const sess=WINS[WIN];
  const W=winDays(e.tk,e.d,sess);
  const days=W.days;
  const mm=days.map(d=>mOf(d,e.tk));
  const p=PRICES[e.tk];
  const pl=days.map(d=>{const k=p?p.d.indexOf(d):-1;return k>=0?p.c[k]:null;});
  const span=`${days[0]} → ${days[days.length-1]}`;
  /* Say how much of the window exists. "I picked 2W and got four days" was a real
     question about the other page, and the answer was always that the archive simply
     ended there — which nothing on screen said. */
  const spanNote=sess==null?`Full archive · ${span}`
    :!W.priced?`${span} · no sessions yet — prices have not reached this spike`
    :W.have>=sess?`${span} · ${sess} of ${sess} sessions after the spike`
    :`${span} · ${W.have} of ${sess} sessions priced — fills in as sessions close`;
  const st=(k,v,c='')=>`<div class="stat"><div class="k">${k}</div><div class="v ${c}">${v}</div></div>`;
  return `<button class="back" data-back="1">‹ All spikes</button>
  <div class="dHead"><div>
      <div class="dTk">${e.tk}${BASKET.has(e.tk)?' <span class="badge b">basket</span>':''}</div>
      <p class="dSub">Confirmed spike on ${e.d} · read ${capLabel(e.d)}${settled(e.d)?'':' · before the close'}</p>
    </div>
    <div class="dOut"><div class="v ${cls(e.r10)}">${e.r10==null?'<span class="mut">pending</span>':pct(e.r10)}</div>
      <div class="k">10 sessions after</div></div></div>
  <div class="stats">
    ${st('mentions that day',e.m)}
    ${st('prior 20-day median',e.med.toFixed(1))}
    ${st('multiple',' ×'+(e.m/Math.max(e.med,1)).toFixed(1))}
    ${st('after 5',e.r5==null?'—':pct(e.r5),cls(e.r5))}
    ${st('after 10',e.r10==null?'—':pct(e.r10),cls(e.r10))}
    ${st('after 20',e.r20==null?'—':pct(e.r20),cls(e.r20))}
  </div>
  <div class="chartbox">${chart(days,mm,pl,e.d)}
    <div class="cLegend"><span><i style="background:var(--acc)"></i>price</span>
      <span><i style="background:var(--bar)"></i>mentions</span>
      <span><i style="background:var(--dn)"></i>spike day</span>
      <span><i style="border:1px solid var(--bar)"></i>read before the close — not comparable</span></div>
    <div class="winbar"><span class="mut" style="font-size:11.5px">after spike</span>
      <div class="chips">${Object.keys(WINS).map(k=>
        `<button data-win="${k}" aria-pressed="${WIN===k}">${k==='all'?'ALL':'+'+k}</button>`).join('')}</div></div>
    <p class="note">${spanNote}</p>
  </div>`;
}
function boardDetail(){
  const r=boardRows().find(x=>x.ticker===SEL); if(!r)return '';
  const prior=DAYS.filter(d=>d<=DAY).slice(-40);
  const mm=prior.map(d=>mOf(d,r.ticker));
  const p=PRICES[r.ticker];
  const pl=prior.map(d=>{const k=p?p.d.indexOf(d):-1;return k>=0?p.c[k]:null;});
  const mine=EVENTS.filter(e=>e.tk===r.ticker);
  const st=(k,v,c='')=>`<div class="stat"><div class="k">${k}</div><div class="v ${c}">${v}</div></div>`;
  const d24=r.mentions-r.mentions_24h_ago;
  return `<button class="back" data-back="1">‹ The board</button>
  <div class="dHead"><div>
    <div class="dTk">${r.ticker}${BASKET.has(r.ticker)?' <span class="badge b">basket</span>':''}</div>
    <p class="dSub">${esc(r.name||r.ticker)} · rank #${r.rank} on ${DAY}</p></div>
    <div class="dOut"><div class="v">${r.mentions}</div><div class="k">mentions</div></div></div>
  <div class="stats">
    ${st('prior 20-day median',r.med.toFixed(1))}
    ${st('multiple',' ×'+r.x.toFixed(1),r.hot?'dn':'')}
    ${st('24h change',(d24>=0?'+':'')+d24,d24>0?'up':d24<0?'dn':'')}
    ${st('rank 24h ago','#'+r.rank_24h_ago)}
    ${st('upvotes',r.upvotes)}
    ${st('past spikes',mine.length)}
  </div>
  <div class="chartbox">${chart(prior,mm,pl,r.hot?DAY:'')}
    <div class="cLegend"><span><i style="background:var(--acc)"></i>price</span>
      <span><i style="background:var(--bar)"></i>mentions</span>
      <span><i style="border:1px solid var(--bar)"></i>read before the close</span></div>
    <p class="note">Last 40 archive days through ${DAY}.</p></div>
  ${mine.length?`<h3>Past confirmed spikes</h3><div class="tblwrap"><table>
    <thead><tr><th>date</th><th class="n">mentions</th><th class="n">×</th><th class="n">5d</th><th class="n">10d</th><th class="n">20d</th></tr></thead>
    <tbody>${mine.slice().sort((a,b)=>b.d.localeCompare(a.d)).map(e=>{
      const f=n=>{const v=ret(e.tk,e.d,n);return v==null?'<span class="mut">—</span>':`<span class="${cls(v)}">${pct(v)}</span>`;};
      return `<tr><td>${e.d}</td><td class="n">${e.m}</td><td class="n">×${(e.m/Math.max(e.med,1)).toFixed(0)}</td>
        <td class="n">${f(5)}</td><td class="n">${f(10)}</td><td class="n">${f(20)}</td></tr>`;}).join('')}
    </tbody></table></div>`:''}`;
}
function marketHTML(){
  if(!RISK)return `<div class="dHead"><div><div class="dTk">Market</div>
    <p class="dSub">Systemic gauges, independent of the attention archive.</p></div></div>
    <p class="note">Loading market gauges…</p>`;
  const gauge=(title,dates,vals,note,unit='')=>{
    if(!dates||!dates.length)return '';
    const last=vals[vals.length-1];
    const lo=Math.min(...vals),hi=Math.max(...vals);
    const p=Math.round((vals.filter(v=>v<last).length/vals.length)*100);
    return `<h3>${title}</h3>
      <div class="stats"><div class="stat"><div class="k">latest · ${dates[dates.length-1]}</div>
        <div class="v">${unit}${last.toFixed(2)}</div></div>
        <div class="stat"><div class="k">percentile in window</div><div class="v">P${p}</div></div>
        <div class="stat"><div class="k">range</div><div class="v">${lo.toFixed(1)} – ${hi.toFixed(1)}</div></div></div>
      <div class="chartbox">${chart(dates,null,vals,'',760,190,unit)}
        <p class="note">${note}</p></div>`;
  };
  return `<div class="dHead"><div><div class="dTk">Market</div>
      <p class="dSub">Systemic gauges, independent of the attention archive.</p></div></div>`
    +gauge('SKEW · black-swan index',RISK.dates.slice(-90),RISK.skew.slice(-90),
        'Deliberately not about WSB attention. It is here so a result can be read against the regime it happened in.')
    +gauge('GEX · dealer gamma ($bn)',(RISK.gex_dates||[]).slice(-60),(RISK.gex_bn||[]).slice(-60),
        'Billions of dollars of dealer gamma. Positive suppresses volatility; negative amplifies it.');
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const v=e.target.closest('[data-v]');
  if(v){VIEW=v.dataset.v;SEL=null;SHOWN=40;render();return;}
  if(e.target.closest('[data-rail]')){$('rail').classList.add('open');return;}
  if(e.target.closest('#railClose')){$('rail').classList.remove('open');return;}
  if(e.target.closest('[data-back]')){$('pane').classList.remove('showDetail');return;}
  const s=e.target.closest('[data-sort]');
  if(s){SORT=s.dataset.sort;SHOWN=40;render();$('rail').classList.remove('open');return;}
  const o=e.target.closest('[data-only]');
  if(o){ONLY=o.dataset.only;SHOWN=40;render();$('rail').classList.remove('open');return;}
  const w=e.target.closest('[data-win]');
  if(w){WIN=w.dataset.win;renderDetail();writeURL();return;}
  if(e.target.closest('#more')){SHOWN+=40;renderList();return;}
  if(e.target.closest('#csv')){exportCSV();return;}
  const row=e.target.closest('.row');
  if(row){SEL=row.dataset.k;markSel();renderDetail();writeURL();
    $('pane').classList.add('showDetail');}
});
document.addEventListener('keydown',e=>{
  /* `e.target` is not always an element — a key pressed with nothing focused targets
     `document`, which has no .matches, and the throw took the whole handler with it. */
  if(e.target&&e.target.matches&&e.target.matches('input,select'))return;
  if(e.key==='j'||e.key==='k'||e.key==='ArrowDown'||e.key==='ArrowUp'){
    const rows=[...$('list').querySelectorAll('.row')];
    const i=rows.findIndex(r=>r.dataset.k===SEL);
    const j=Math.max(0,Math.min(rows.length-1,i+((e.key==='j'||e.key==='ArrowDown')?1:-1)));
    if(rows[j]){SEL=rows[j].dataset.k;markSel();renderDetail();writeURL();
      rows[j].scrollIntoView({block:'nearest'});e.preventDefault();}
  }
  if(e.key==='/'){$('q').focus();e.preventDefault();}
});
$('q').addEventListener('input',e=>{Q=e.target.value.toUpperCase();SHOWN=40;SEL=null;
  if(VIEW!=='market')render();});
$('day').addEventListener('change',async e=>{DAY=e.target.value;await loadDays([DAY]);SEL=null;render();});

function exportCSV(){
  const L=eventRows();
  const cols=[['date',e=>e.d],['ticker',e=>e.tk],['in_basket',e=>BASKET.has(e.tk)?'yes':'no'],
    ['mentions_spike_day',e=>e.m],['prior_20d_median',e=>e.med.toFixed(1)],
    ['multiple',e=>(e.m/Math.max(e.med,1)).toFixed(1)],
    ['read_at_utc',e=>capLabel(e.d)],['settled_after_close',e=>settled(e.d)?'yes':'no'],
    ['ret_5d_pct',e=>e.r5==null?'':e.r5.toFixed(2)],
    ['ret_10d_pct',e=>e.r10==null?'':e.r10.toFixed(2)],
    ['ret_20d_pct',e=>e.r20==null?'':e.r20.toFixed(2)]];
  const cell=v=>{const t=String(v??'');return /[",\n]/.test(t)?'"'+t.replace(/"/g,'""')+'"':t;};
  const csv=[cols.map(c=>c[0]).join(',')].concat(L.map(e=>cols.map(c=>cell(c[1](e))).join(','))).join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download=`salience-spikes-${DAY}.csv`;a.click();
}
</script>
</body></html>
