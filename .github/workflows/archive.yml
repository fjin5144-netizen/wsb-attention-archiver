name: Archive WSB attention data

on:
  # 一天的档案值 = 当天最后一次成功运行的读数。所以「定格在收盘后」不是靠某一档
  # cron 准时,而是靠收盘后还有足够多次尝试落地 —— GitHub 丢档很凶(08-03 排 11 档
  # 只跑了 4 次),还会延迟到离谱:08-03 的 23:45 那档在 08-04 上午 09:49 才执行,
  # 于是把 08-04 定格成了开盘前的读数。
  schedule:
    - cron: '45 11 * * *'       # 早间保底,万一后面全丢了也有一笔
    # 含周末。原本是 '* * 1-5',周末于是只剩早间那一档,10 个未在收盘后定格的日子里
    # 有 8 个是周末 —— mentions 是滚动 24h,午间读数和收盘读数不可比。
    - cron: '15 13-20 * * *'
    # 收盘后(EDT 20:00 / EST 21:00 UTC)密集尝试。多打几次是唯一能对抗丢档的办法;
    # 不排到 23:35 之后,因为延迟跨过午夜就会写进第二天,反而害了这一天。
    - cron: '5,35 21 * * *'
    - cron: '5,35 22 * * *'
    - cron: '5 23 * * *'
  workflow_dispatch:
  push:
    # 限定 main:没有分支过滤时,在特性分支上推一下采集脚本就会在那条分支上跑一次
    # 完整归档 —— 把快照提交到分支,还把 backup 分支强推成分支内容,而 backup 的
    # 全部意义是「main 的另一份副本」。
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/archive.yml'

# 关键:同组运行串行排队,从根上消灭并发写数据的竞态
concurrency:
  group: wsb-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch snapshots
        run: python3 scripts/archive.py
      # 顺序有讲究:先验数据本身,再从它派生,最后在提交前把派生结果对着归档重算一遍。
      # 一个算少了 29% 的 events.json 不会报错、看起来也正常 —— 只有独立重算能拦住它。
      - name: Validate snapshot integrity
        run: python3 scripts/validate.py
      # 把「读到这个提及数的那一刻」的价格也存下来。价格包是收盘价,而快照是任意时刻读的,
      # 两者本来对不齐。顺带:这是浏览器实时报价唯一的记忆 —— 源哪天挂了,站点还能退回
      # 最后一次归档的报价并说明它有多旧。CNBC 支持批量,40 只票一个请求。
      - name: Archive the board price at read time
        run: python3 scripts/quotes.py
      # 关注度每天在长,价格包却是手工嵌进 index.html 的,于是悄悄落后了 17 天:
      # 事件图的提及柱画到右边缘,价格线却早早断掉。整包重抓仍然一天一次就够 ——
      # 146 个请求跟着每小时的快照跑既没必要也不礼貌 —— 但触发条件从「'45 23' 这档
      # cron 跑了」改成「数据确实落后了」:那档 cron 恰恰是最不可靠的一档,把
      # 「spike 能否变成结果」挂在它身上,方向搞反了。不落后时这一步几毫秒就返回。
      - name: Refresh the full price pack when it is behind
        run: python3 scripts/refresh_prices.py --if-stale
      # 但补漏必须每次都跑。当天那份快照每小时被覆盖重写,mentions 是滚动 24h、
      # 一整天都在长,所以盘中越线的票**立刻**成为事件,而整包刷新一天只排一档
      # 且常被 GitHub 丢掉(08-03 排 11 档只实际跑了 4 次)。这段空窗就是
      # 2026-08-04 AAOI / NVO 把归档卡红一整天的原因。没有新票时是 0 个请求。
      - name: Top up prices for newly-spiking tickers
        run: python3 scripts/refresh_prices.py --top-up
      - name: Precompute events
        run: python3 scripts/precompute_events.py
      # 站点顶部那句结论。放在事件集之后:它是从事件集和价格算出来的,
      # 而且跟 events.json 一样是「不会报错、只会安静地错」的那类产物 ——
      # 所以黄金测试里有一条独立重算它。
      - name: Compute the headline finding
        run: python3 scripts/finding.py
      # 五年跨期检验。它读的是 data/wayback(独立数据集)加历史价格,两者都不随每日采集
      # 变化 —— 但事件集会,所以跟着一起重算,免得站点上两个数字来自不同时刻。
      - name: Recompute the cross-period check
        run: python3 scripts/finding_rank.py
      # 浏览器里那份扫描是 precompute_events.py 和 finding.py 的 JS 重写,滑块一动就跑它。
      # selfCheck() 只在默认参数下比对 —— 而默认恰恰是唯一有黄金文件的那一组。这一步在
      # 40 组定义上把两边逐条对齐(事件集 + describe() 的每个字段),抓到过一个黄金文件
      # 永远碰不到的分歧:Python 的 round() 五舍六入到偶数,Math.round 逢五进一。
      - name: Cross-check the browser scan against the Python
        run: |
          python3 scripts/crosscheck_scan.py "$RUNNER_TEMP/scan_ref.json"
          node scripts/crosscheck_scan.js "$RUNNER_TEMP/scan_ref.json"
      # continue-on-error 不是在放过失败 —— 下面「Fail if the golden tests failed」
      # 照样把这次运行判红、照样告警。它换来的是:测试挂掉时原始档案仍然落地。
      - name: Golden-value tests
        id: tests
        continue-on-error: true
        run: |
          python3 -m pip install --quiet pytest
          python3 -m pytest tests/ -q
      - name: Commit & push
        run: |
          git config user.name "wsb-archiver-bot"
          git config user.email "bot@users.noreply.github.com"
          msg="snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          # 派生产物没过校验就退回上一个好版本,但原始档案照常提交。
          # 档案是项目唯一不可再生的资产(回填源已 404,那 66 天只剩这一份副本),
          # 让它被一个派生数据的断言连坐丢掉,是把因果关系搞反了。
          if [ "${{ steps.tests.outcome }}" != "success" ]; then
            for f in data/events.json data/finding.json data/finding_rank.json data/prices.json data/price_gaps.json; do
              # HEAD 要写明:`git checkout -- <path>` 是从索引恢复的,不是从上一次提交
              if git cat-file -e "HEAD:$f" 2>/dev/null; then git checkout HEAD -- "$f"; else rm -f "$f"; fi
            done
            msg="$msg (archive only — golden tests failed)"
          fi
          git add data/ index.html
          if git diff --staged --quiet; then echo "no changes"; exit 0; fi
          git commit -m "$msg"
          # 先提交后变基:工作区永远干净,冲突标记不可能进文件;
          # 万一上游恰有新提交,-X theirs 让本次快照数据获胜;失败则响亮报错,绝不静默吞掉
          git pull --rebase -X theirs
          git push

      - name: Update secondary backup branch
        if: success()
        run: |
          git checkout -B backup
          git push origin backup --force

      - name: Fail if the golden tests failed
        if: steps.tests.outcome != 'success'
        run: |
          echo "Archive committed, but the golden-value tests failed — derived artefacts were rolled back."
          exit 1

  # 独立作业,不是 archive 里的一步。2026-08-06 那两次运行没拿到 runner 就被取消了
  # (runner 为空、steps=0),作业里的任何一步都没执行 —— 一个 in-job 的告警步骤在这种
  # 失败模式下永远不可能响。而且 `if: failure()` 本来也匹配不到 cancelled。
  notify:
    needs: archive
    if: always() && needs.archive.result != 'success'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Alert
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 复用同一个 issue。每次失败开一张新的,一个坏掉的下午就堆出三条一模一样的
          # 告警(#1 #2 #3 就是这么来的),多出来的两条一点信息量都没有。
          r="${{ needs.archive.result }}"
          extra=""
          if [ "$r" = "cancelled" ]; then
            extra=$'\n\n作业被取消 —— 通常是没有分配到 runner(等满 15 分钟)。本次采集完全没有执行。'
          fi
          body="归档作业在 \`$(date -u +%Y-%m-%dT%H:%MZ)\` 结束于 \`$r\`。见 [workflow run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)。$extra"
          n=$(gh issue list --state open --limit 50 --json number,title \
                -q '[.[] | select(.title | contains("Archive Cron Failed"))][0].number // empty')
          if [ -n "$n" ]; then
            gh issue comment "$n" --body "$body"
          else
            gh issue create --title "🚨 Archive Cron Failed" --body "$body"
          fi
